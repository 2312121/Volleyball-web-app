{% extends "layout.html" %}

{% block body %}

<div class="article">


    <img
        src="{{ url_for('static', filename='images/' + article[4]) }}"
        class="article-image">

    <span class="category">
        {{ article[1] }}
    </span>

    <h1>
        {{ article[5] }}
    </h1>

    <p class="article-info">
        {{ article[2] }}
    </p>

    <p>
        {{ article[3] }}
    </p>


    <a href="{{ url_for('home') }}" class="back-button">
        Back to Home
    </a>

</div>


{% endblock %}
